services:
  # Nombre con prefijo del proyecto (2026-09-27): compose registra el nombre del
  # servicio como alias DNS en cada red, y dokploy-network la comparten todos
  # los proyectos del EPYC. Un `app` a secas lo reclamaban nueve proyectos a la
  # vez y Docker reparte las resoluciones entre todos.
  image-metadata-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.image-metadata.rule=Host(`image-metadata.codelabs.studio`)"
      - "traefik.http.routers.image-metadata.entrypoints=websecure"
      - "traefik.http.routers.image-metadata.tls=true"
      - "traefik.http.routers.image-metadata.tls.certresolver=letsencrypt-dns"
      - "traefik.http.services.image-metadata.loadbalancer.server.port=3000"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
